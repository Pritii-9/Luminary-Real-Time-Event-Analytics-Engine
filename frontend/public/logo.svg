<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="luminaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" /> <!-- Emerald 500 -->
      <stop offset="100%" stop-color="#1E293B" /> <!-- Slate 800 -->
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" /> <!-- Slate 900 -->
      <stop offset="100%" stop-color="#34D399" /> <!-- Emerald 400 -->
    </linearGradient>
  </defs>

  <!-- Rounded Background Plate -->
  <rect width="256" height="256" rx="56" fill="url(#luminaryBg)" />

  <!-- L-shaped Chart Axis -->
  <path d="M 64 64 L 64 192 L 192 192" fill="none" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Analytics Bars -->
  <rect x="92" y="140" width="24" height="36" rx="6" fill="#F8FAFC" />
  <rect x="132" y="96" width="24" height="80" rx="6" fill="#F8FAFC" />
  <rect x="172" y="64" width="24" height="112" rx="6" fill="#A7F3D0" />

  <!-- Luminary Sparkle / Star -->
  <path d="M 184 24 Q 184 44 204 44 Q 184 44 184 64 Q 184 44 164 44 Q 184 44 184 24 Z" fill="#F8FAFC" />
</svg>
