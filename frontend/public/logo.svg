<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <!-- Background / Icon Gradient -->
    <linearGradient id="luminary-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Light Accent Sparkle -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container matching dashboard elements -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="#18181B" stroke="#27272A" stroke-width="2" />

  <!-- Analytics Bar Chart Icon in Dashboard Green -->
  <rect x="28" y="52" width="9" height="22" rx="3" fill="#22C55E" opacity="0.4" />
  <rect x="43" y="38" width="9" height="36" rx="3" fill="#22C55E" opacity="0.75" />
  <rect x="58" y="24" width="9" height="50" rx="3" fill="#4ADE80" />

  <!-- Live/Luminary Glow Dot -->
  <circle cx="68" cy="22" r="4" fill="#4ADE80" />

  <!-- Brand Text -->
  <text x="110" y="55" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700" font-size="30" fill="#FFFFFF" letter-spacing="-0.5">Luminary</text>
  <text x="110" y="76" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#4ADE80" letter-spacing="3.5">ANALYTICS</text>
</svg>
